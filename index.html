<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="hug.ico" type="image/x-icon">
    <title>HF-TrendRadar — HuggingFace 資料集趨勢雷達</title>
    <meta name="description" content="每天自動追蹤 Hugging Face 資料集的熱度與成長動能，提供三種排行榜、動能排名與 AI 洞察報告。">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="HF-TrendRadar">
    <meta property="og:title" content="HF-TrendRadar — HuggingFace 資料集趨勢雷達">
    <meta property="og:description" content="每天自動追蹤 Hugging Face 資料集的熱度與成長動能，提供三種排行榜、動能排名與 AI 洞察報告。">
    <meta property="og:url" content="https://yesaouo.github.io/HF-TrendRadar/">
    <meta property="og:image" content="https://yesaouo.github.io/HF-TrendRadar/assets/og.png">
    <meta name="twitter:card" content="summary_large_image">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.12/lib/marked.umd.min.js"
            integrity="sha384-1W3J5zmRIOV+OlYxSfzN5e3LuQ0/UhyGMh1q2hEV2+WHTEGDZVK3z/XCyKN1dVWn"
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.15/purify.min.js"
            integrity="sha384-uUMu9JDY09vBzRf9SPcK2VgUj+W/70J6Soc+Dded5P474ElQ63iv9j5N3DE7Kp3N"
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        :root {
            color-scheme: light dark;

            --bg: #f3f5f8;
            --surface: #ffffff;
            --surface-2: #f7f9fb;
            --text: #1f2933;
            --text-muted: #626e77;
            --border: #e2e8ee;
            --border-strong: #cfd8e0;

            --accent: #2f6fb0;
            --accent-hover: #255c95;
            --accent-contrast: #ffffff;
            --header-bg: #22303d;
            --header-text: #f2f6f9;
            --header-muted: #a9b8c4;

            --up: #1a7f4b;
            --down: #b3452f;
            --ok: #1a7f4b;

            --shadow-sm: 0 1px 2px rgba(16, 24, 32, .05);
            --shadow-md: 0 1px 2px rgba(16, 24, 32, .05), 0 6px 16px rgba(16, 24, 32, .07);
            --shadow-lg: 0 12px 32px rgba(16, 24, 32, .18);
            --radius: 10px;

            --modality-3d: #6a1b9a;
            --modality-audio: #a65a00;
            --modality-geospatial: #00796b;
            --modality-image: #1565c0;
            --modality-tabular: #6d4c41;
            --modality-text: #c62828;
            --modality-timeseries: #0277bd;
            --modality-video: #ad1457;
            --modality-default: #546e7a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #11161b;
                --surface: #1a222a;
                --surface-2: #212b34;
                --text: #e5edf4;
                --text-muted: #94a3b0;
                --border: #2b3742;
                --border-strong: #3a4753;

                --accent: #5aa7e8;
                --accent-hover: #7cbaee;
                --accent-contrast: #0c1116;
                --header-bg: #151d24;
                --header-text: #e5edf4;
                --header-muted: #8fa0ad;

                --up: #46c98a;
                --down: #ef8a6e;
                --ok: #46c98a;

                --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
                --shadow-md: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 16px rgba(0, 0, 0, .35);
                --shadow-lg: 0 12px 32px rgba(0, 0, 0, .55);

                --modality-3d: #c084e8;
                --modality-audio: #f0a53f;
                --modality-geospatial: #4db6ac;
                --modality-image: #64b5f6;
                --modality-tabular: #bcaaa4;
                --modality-text: #ef9a9a;
                --modality-timeseries: #4fc3f7;
                --modality-video: #f48fb1;
                --modality-default: #90a4ae;
            }
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 16px 8px;
        }

        /* ---------- Header ---------- */
        header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 28px 16px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: clamp(1.4em, 4vw, 2.1em);
            letter-spacing: -0.01em;
            line-height: 1.25;
        }

        header p {
            margin: 8px 0 0;
            font-size: 0.95em;
            color: var(--header-muted);
        }

        /* ---------- Tabs ---------- */
        .tabs {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 24px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .tab-button {
            padding: 13px 20px;
            cursor: pointer;
            border: none;
            background-color: transparent;
            font-size: 1em;
            font-family: inherit;
            color: var(--text-muted);
            transition: background-color .2s, color .2s;
            flex: 1 1 120px;
            text-align: center;
            font-weight: 600;
        }

        .tab-button.active {
            background-color: var(--accent);
            color: var(--accent-contrast);
        }

        .tab-button:hover:not(.active) {
            background-color: var(--surface-2);
            color: var(--text);
        }
        .tab-button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        /* ---------- 摘要區 ---------- */
        .digest-section {
            background-color: var(--surface);
            border: 1px solid var(--border);
            padding: 22px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 28px;
        }
        .digest-header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 4px 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .digest-section h2 {
            margin: 0;
            font-size: 1.25em;
            color: var(--text);
        }
        .digest-meta {
            font-size: 0.85em;
            color: var(--text-muted);
            margin-left: auto;
        }
        .digest-meta.stale { color: var(--down); }

        #digest-content {
            word-wrap: break-word;
            font-size: 0.97em;
        }
        #digest-content > :first-child { margin-top: 0; }
        #digest-content > :last-child { margin-bottom: 0; }
        #digest-content h1, #digest-content h2,
        #digest-content h3, #digest-content h4 {
            margin: 1.4em 0 .5em;
            line-height: 1.35;
            color: var(--text);
        }
        #digest-content h1 { font-size: 1.3em; }
        #digest-content h2 { font-size: 1.15em; }
        #digest-content h3 { font-size: 1.05em; }
        #digest-content h4 { font-size: 1em; color: var(--text-muted); }
        #digest-content ul, #digest-content ol { padding-left: 1.4em; }
        #digest-content li { margin-bottom: .35em; }
        #digest-content a { color: var(--accent); }
        #digest-content code {
            background-color: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: .1em .35em;
            font-size: .9em;
        }
        #digest-content pre {
            background-color: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            overflow-x: auto;
        }
        #digest-content pre code { border: none; padding: 0; background: none; }
        #digest-content blockquote {
            margin: 1em 0;
            padding-left: 14px;
            border-left: 3px solid var(--border-strong);
            color: var(--text-muted);
        }
        #digest-content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1.5em 0;
        }
        #digest-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
        }
        #digest-content th, #digest-content td {
            border: 1px solid var(--border);
            padding: 6px 10px;
            text-align: left;
        }
        #digest-content th { background-color: var(--surface-2); }

        /* ---------- Trending 統計 ---------- */
        .trend-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }
        .trend-stat {
            flex: 1 1 110px;
            background-color: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
        }
        .trend-stat .value {
            display: block;
            font-size: 1.5em;
            font-weight: 700;
            color: var(--text);
            font-variant-numeric: tabular-nums;
            line-height: 1.2;
        }
        .trend-stat .label {
            font-size: 0.8em;
            color: var(--text-muted);
        }
        .trend-note {
            font-size: 0.88em;
            color: var(--text-muted);
        }
        .trend-lists {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
            margin-top: 16px;
        }
        .trend-lists > div {
            background-color: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
        }
        .trend-lists h4 {
            margin: 0 0 8px;
            font-size: 0.95em;
            color: var(--text);
        }
        .trend-lists ul {
            margin: 0;
            padding-left: 18px;
            font-size: 0.9em;
        }
        .trend-lists a {
            color: var(--accent);
            text-decoration: none;
            word-break: break-all;
        }
        .trend-lists a:hover { text-decoration: underline; }

        /* ---------- 工具列：搜尋 / 篩選 / 排序 ---------- */
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
        }
        .toolbar[hidden] { display: none; }
        .toolbar-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        #filter-search {
            flex: 1 1 240px;
            min-width: 0;
            padding: 9px 14px;
            border: 1px solid var(--border-strong);
            border-radius: 999px;
            background-color: var(--surface);
            color: var(--text);
            font-size: 0.95em;
            font-family: inherit;
        }
        #filter-search:focus-visible,
        #filter-sort:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }
        .sort-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 1 auto;
        }
        .sort-label {
            font-size: 0.88em;
            color: var(--text-muted);
            white-space: nowrap;
        }
        #filter-sort {
            padding: 9px 12px;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            background-color: var(--surface);
            color: var(--text);
            font-family: inherit;
            font-size: 0.92em;
            min-width: 0;
        }

        @media (max-width: 560px) {
            .toolbar { gap: 12px; }
            #filter-search { flex: 1 1 100%; }
            .sort-group { flex: 1 1 100%; }
            #filter-sort { flex: 1; }
            .filter-modalities { gap: 5px; }
            .modality-filter { padding: 4px 9px; }
        }
        .filter-modalities {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .filter-modalities:empty { display: none; }

        .modality-filter {
            font-family: inherit;
            cursor: pointer;
            padding: 4px 11px;
            border-radius: 999px;
            font-size: 0.8em;
            font-weight: 600;
            color: color-mix(in srgb, var(--badge-color, var(--modality-default)) 78%, var(--text));
            background-color: color-mix(in srgb, var(--badge-color, var(--modality-default)) 10%, transparent);
            border: 1px solid color-mix(in srgb, var(--badge-color, var(--modality-default)) 30%, transparent);
            transition: background-color .15s, border-color .15s;
        }
        .modality-filter:hover {
            background-color: color-mix(in srgb, var(--badge-color, var(--modality-default)) 18%, transparent);
        }
        .modality-filter[aria-pressed="true"] {
            background-color: color-mix(in srgb, var(--badge-color, var(--modality-default)) 22%, transparent);
            border-color: color-mix(in srgb, var(--badge-color, var(--modality-default)) 70%, transparent);
        }
        .modality-filter::before {
            content: "✓";
            visibility: hidden;
            margin-right: .35em;
        }
        .modality-filter[aria-pressed="true"]::before { visibility: visible; }
        .modality-filter:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }
        .modality-filter .count {
            opacity: .65;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        .toolbar-foot {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.87em;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }
        .link-button {
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            color: var(--accent);
            cursor: pointer;
            text-decoration: underline;
        }
        .link-button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        .digest-section[hidden] { display: none; }
        .loading-note {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            background-color: var(--surface);
            border: 1px dashed var(--border-strong);
            border-radius: var(--radius);
        }

        /* ---------- 資料集卡片 ---------- */
        .datasets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .dataset-card {
            position: relative;
            background-color: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 18px 18px 22px;
            box-shadow: var(--shadow-sm);
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }

        .dataset-card::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 4px;
            background: var(--card-accent, var(--modality-default));
        }

        .dataset-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--border-strong);
        }

        .card-open {
            font: inherit;
            color: inherit;
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            text-align: left;
            width: 100%;
            cursor: pointer;
        }
        .card-open:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 4px;
        }
        .dataset-card:has(.card-open:focus-visible) {
            border-color: var(--accent);
            box-shadow: var(--shadow-md);
        }

        .dataset-card h3 {
            margin: 0;
            font-size: 1.05em;
            line-height: 1.4;
            word-break: break-word;
            color: var(--text);
        }
        .dataset-card .description {
            margin: 0;
            font-size: 0.9em;
            color: var(--text-muted);
            flex-grow: 1;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }
        .dataset-card .card-foot {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
        }
        .dataset-card .meta-info {
            margin: 0;
            font-size: 0.85em;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }
        .dataset-card .meta-info strong {
            color: var(--text);
            font-weight: 600;
        }

        .modalities-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .modality-badge {
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 0.76em;
            font-weight: 600;
            letter-spacing: .02em;
            color: color-mix(in srgb, var(--badge-color, var(--modality-default)) 78%, var(--text));
            background-color: color-mix(in srgb, var(--badge-color, var(--modality-default)) 13%, transparent);
            border: 1px solid color-mix(in srgb, var(--badge-color, var(--modality-default)) 32%, transparent);
        }

        /* ---------- Trending 卡片上的變化幅度 ---------- */
        .trend-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .trend-chip {
            font-size: 0.82em;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 999px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            color: var(--text-muted);
            background-color: var(--surface-2);
            border: 1px solid var(--border);
        }
        .trend-chip.up {
            color: var(--up);
            background-color: color-mix(in srgb, var(--up) 12%, transparent);
            border-color: color-mix(in srgb, var(--up) 30%, transparent);
        }
        .trend-chip.down {
            color: var(--down);
            background-color: color-mix(in srgb, var(--down) 12%, transparent);
            border-color: color-mix(in srgb, var(--down) 30%, transparent);
        }
        .card-head {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .card-head h3 { flex: 1; }
        .trend-rank {
            flex-shrink: 0;
            font-weight: 700;
            font-size: 0.8em;
            font-variant-numeric: tabular-nums;
            color: var(--text-muted);
            background-color: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 2px 8px;
        }

        /* ---------- Modal ---------- */
        dialog.modal {
            padding: 0;
            border: none;
            background: transparent;
            color: var(--text);
            width: min(92%, 700px);
            max-width: 100%;
            max-height: 90vh;
            overflow: visible;
        }
        dialog.modal::backdrop {
            background-color: rgba(8, 12, 16, .6);
            animation: fadeIn .25s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-content {
            background-color: var(--surface);
            padding: 28px;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideIn .25s;
        }
        @keyframes slideIn { from { transform: translateY(-18px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-header {
            padding-right: 36px;
            margin-bottom: 18px;
        }
        .modal-content h2 {
            margin: 0 0 4px;
            font-size: 1.2em;
            line-height: 1.4;
            color: var(--text);
            word-break: break-word;
        }
        .modal-content h2 a {
            color: inherit;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .modal-content h2 a:hover { color: var(--accent); }
        .modal-content h2 svg { flex-shrink: 0; opacity: .55; }
        .modal-author {
            margin: 0;
            font-size: 0.9em;
            color: var(--text-muted);
        }

        .modal-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }
        .modal-stat {
            flex: 1 1 100px;
            background-color: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
        }
        .modal-stat[hidden] { display: none; }
        .modal-stat .value {
            display: block;
            font-size: 1.4em;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            line-height: 1.25;
        }
        .modal-stat .label {
            font-size: 0.78em;
            color: var(--text-muted);
        }
        .modal-stat.up .value { color: var(--up); }
        .modal-stat.down .value { color: var(--down); }

        .modal-props {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 10px 18px;
            align-items: baseline;
            margin: 0 0 22px;
            padding: 16px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        .modal-props dt {
            font-size: 0.85em;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .modal-props dd {
            margin: 0;
            font-variant-numeric: tabular-nums;
            min-width: 0;
        }
        @media (max-width: 480px) {
            .modal-props { grid-template-columns: 1fr; gap: 2px 0; }
            .modal-props dt { margin-top: 12px; }
            .modal-props dt:first-child { margin-top: 0; }
        }

        .modal-section { margin-bottom: 22px; }
        .modal-section h3 {
            margin: 0 0 8px;
            font-size: 0.85em;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: .03em;
            text-transform: uppercase;
        }

        .modal-content .description-full {
            max-height: 200px;
            overflow-y: auto;
            background-color: var(--surface-2);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: .92em;
        }
        .tags-toggle {
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            font-size: 0.85em;
            color: var(--accent);
            cursor: pointer;
            text-decoration: underline;
        }
        .tags-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .modal-content .tags-list, .modal-content .modal-modalities-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .modal-content .tag-badge {
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 0.82em;
            background-color: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-muted);
        }
        .modal-content .modal-modality-badge {
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 0.82em;
            font-weight: 600;
            color: color-mix(in srgb, var(--badge-color, var(--modality-default)) 78%, var(--text));
            background-color: color-mix(in srgb, var(--badge-color, var(--modality-default)) 13%, transparent);
            border: 1px solid color-mix(in srgb, var(--badge-color, var(--modality-default)) 32%, transparent);
        }

        .modal-content .viewer-samples img,
        .modal-content .viewer-samples video {
            max-width: 160px;
            max-height: 160px;
            margin: 4px 4px 4px 0;
            border: 1px solid var(--border);
            border-radius: 6px;
            vertical-align: top;
            background-color: var(--surface-2);
        }
        .modal-content .viewer-samples video { width: 240px; max-width: 100%; }
        .sample-note {
            font-size: 0.85em;
            color: var(--text-muted);
            margin: 8px 0 0;
        }
        .sample-note a {
            color: var(--accent);
            margin-left: 6px;
        }
        .modal-content .viewer-samples pre {
            background-color: var(--surface-2);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.85em;
            max-height: 150px;
            overflow: auto;
        }

        .ai-button {
            display: block;
            width: 100%;
            margin: 22px 0 0;
            padding: 12px 20px;
            background-color: var(--accent);
            color: var(--accent-contrast);
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: background-color .2s;
        }
        .ai-button:hover { background-color: var(--accent-hover); }
        .ai-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .ai-button.copied { background-color: var(--up); }

        .close-button {
            color: var(--text-muted);
            position: absolute;
            top: 14px;
            right: 20px;
            font-size: 30px;
            line-height: 1;
            font-weight: 400;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0 4px;
            font-family: inherit;
        }
        .close-button:hover { color: var(--text); }
        .close-button:focus-visible {
            color: var(--text);
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 4px;
        }

        /* ---------- Footer ---------- */
        footer {
            text-align: center;
            padding: 24px 16px;
            margin-top: 40px;
            background-color: var(--header-bg);
            color: var(--header-muted);
            font-size: 0.87em;
        }
        footer p { margin: 4px 0; }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
            .dataset-card:hover { transform: none; }
        }
    </style>
</head>
<body>
    <header>
        <h1>HuggingFace Dataset 趨勢雷達系統</h1>
        <p>每天追蹤 Hugging Face 資料集的熱度與成長動能</p>
    </header>

    <div class="container">
        <div class="tabs" role="tablist" aria-label="排行榜分類">
            <button class="tab-button active" role="tab" id="tab-trending" aria-controls="tab-panel" aria-selected="true" data-tab="trending">Trending</button>
            <button class="tab-button" role="tab" id="tab-downloads" aria-controls="tab-panel" aria-selected="false" tabindex="-1" data-tab="downloads">Downloads</button>
            <button class="tab-button" role="tab" id="tab-likes" aria-controls="tab-panel" aria-selected="false" tabindex="-1" data-tab="likes">Likes</button>
            <button class="tab-button" role="tab" id="tab-last_modified" aria-controls="tab-panel" aria-selected="false" tabindex="-1" data-tab="last_modified">Last Modified</button>
        </div>

        <div id="tab-panel" role="tabpanel" aria-labelledby="tab-trending" tabindex="-1">

        <div id="digest-section" class="digest-section" hidden>
            <div class="digest-header">
                <h2 id="digest-title">摘要報告</h2>
                <span id="digest-meta" class="digest-meta"></span>
            </div>
            <div id="digest-content"></div>
        </div>

        <div id="toolbar" class="toolbar" hidden>
            <div class="toolbar-row">
                <input type="search" id="filter-search" autocomplete="off"
                       placeholder="搜尋資料集 ID、作者或描述…" aria-label="搜尋資料集">
                <div class="sort-group">
                    <label class="sort-label" for="filter-sort">排序</label>
                    <select id="filter-sort">
                        <option value="default">預設順序</option>
                        <option value="downloads">Downloads</option>
                        <option value="likes">Likes</option>
                        <option value="lastModified">Last Modified</option>
                        <option value="name">Name A→Z</option>
                    </select>
                </div>
            </div>
            <div id="filter-modalities" class="filter-modalities"></div>
            <div class="toolbar-foot">
                <span id="filter-count" role="status" aria-live="polite"></span>
                <button type="button" id="filter-clear" class="link-button" hidden>清除篩選</button>
            </div>
        </div>

        <div id="datasets-grid" class="datasets-grid">
            <p class="loading-note">載入資料中…</p>
        </div>
        </div><!-- /#tab-panel -->
    </div>

    <!-- Dataset Details Modal -->
    <dialog id="datasetModal" class="modal" aria-labelledby="modal-title-text">
        <div class="modal-content">
            <button type="button" class="close-button" id="close-dataset-modal" aria-label="關閉">×</button>
            <header class="modal-header">
                <h2>
                    <a id="modal-title-link" href="#" target="_blank" rel="noopener">
                        <span id="modal-title-text">Dataset Details</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                    </a>
                </h2>
                <p class="modal-author">by <span id="modal-author"></span></p>
            </header>

            <div class="modal-stats">
                <div class="modal-stat">
                    <span class="value" id="modal-downloads"></span>
                    <span class="label">Downloads</span>
                </div>
                <div class="modal-stat">
                    <span class="value" id="modal-likes"></span>
                    <span class="label">Likes</span>
                </div>
                <div class="modal-stat" id="modal-trend-stat" hidden>
                    <span class="value" id="modal-trend"></span>
                    <span class="label" id="modal-trend-label"></span>
                </div>
            </div>

            <dl class="modal-props">
                <dt>Modalities</dt>
                <dd id="modal-modalities-list" class="modal-modalities-list"></dd>
                <dt>License</dt><dd id="modal-license"></dd>
                <dt>Tasks</dt><dd id="modal-tasks"></dd>
                <dt>Size</dt><dd id="modal-size"></dd>
                <dt>Languages</dt><dd id="modal-languages"></dd>
                <dt>Created At</dt><dd id="modal-createdAt"></dd>
                <dt>Last Modified</dt><dd id="modal-lastModified"></dd>
            </dl>

            <section class="modal-section">
                <h3>Description</h3>
                <div id="modal-description" class="description-full"></div>
            </section>

            <section class="modal-section">
                <h3>Tags</h3>
                <div id="modal-tags" class="tags-list"></div>
            </section>

            <section class="modal-section viewer-samples">
                <h3>Viewer Samples</h3>
                <div id="modal-viewer-samples"></div>
            </section>

            <button type="button" id="copy-prompt-button" class="ai-button">複製提示詞</button>
        </div>
    </dialog>

    
    <footer>
        <p id="report-created-at">載入中…</p>
        <p>&copy; 2025 yesaouo・採用 MIT License 授權
</p>
    </footer>

    <script>
        const MODALITY_COLORS = {
            "3D": "var(--modality-3d)",
            "Audio": "var(--modality-audio)",
            "Geospatial": "var(--modality-geospatial)",
            "Image": "var(--modality-image)",
            "Tabular": "var(--modality-tabular)",
            "Text": "var(--modality-text)",
            "Time-Series": "var(--modality-timeseries)",
            "Video": "var(--modality-video)",
            "default": "var(--modality-default)"
        };

        let allData = {};
        let datasetIndex = {}; // id -> dataset，給 Trending 分頁補完整資料用
        let trendIndex = {};   // id -> 動能與排名
        let currentDataset = null;
        let currentDatasets = [];       // 目前分頁的資料集
        let currentTrendById = null;    // Trending 分頁才有：id -> 動能與排名
        const filterState = { query: "", modalities: new Set(), sort: "default" };

        // DOM Elements
        
        const datasetModal = document.getElementById('datasetModal');
        const closeDatasetModalButton = document.getElementById('close-dataset-modal');
        
        const copyPromptButton = document.getElementById('copy-prompt-button');

        document.addEventListener('DOMContentLoaded', () => {
            fetch('data/output.json')
                .then(response => response.ok ? response.json() : Promise.reject(`HTTP error! status: ${response.status}`))
                .then(data => {
                    allData = data;
                    document.getElementById('digest-section').hidden = false;
                    buildDatasetIndex();
                    if (allData.created_at) {
                        const createdAtDate = new Date(allData.created_at);
                        document.getElementById('report-created-at').textContent = `資料更新於 ${createdAtDate.toLocaleString()}`;
                    } else {
                        document.getElementById('report-created-at').textContent = '無法取得資料更新時間';
                    }
                    setupTabs();
                    selectTab(allData.trending?.available ? 'trending' : 'downloads');
                })
                .catch(handleFetchError);
            
            setupEventListeners();
        });


        function setupEventListeners() {
            setupFilters();
            closeDatasetModalButton.onclick = () => datasetModal.close();
            copyPromptButton.addEventListener('click', copyPromptToClipboard);

            datasetModal.addEventListener('click', (event) => {
                if (event.target === datasetModal) datasetModal.close();
            });
        }

        function handleFetchError(error) {
            console.error('Error:', error);
            document.getElementById('digest-section').hidden = false;
            document.getElementById('datasets-grid').innerHTML = `<p>載入資料失敗：${escapeHTML(String(error?.message ?? error))}（詳細訊息請看瀏覽器主控台）</p>`;
            document.getElementById('digest-content').innerHTML = '<p>摘要載入失敗</p>';
        }

        function setupTabs() {
            const tabs = [...document.querySelectorAll('.tab-button')];
            tabs.forEach((button, i) => {
                button.addEventListener('click', () => selectTab(button.dataset.tab));
                button.addEventListener('keydown', (e) => {
                    const offset = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
                    let target = null;
                    if (offset !== undefined) target = tabs[(i + offset + tabs.length) % tabs.length];
                    else if (e.key === 'Home') target = tabs[0];
                    else if (e.key === 'End') target = tabs[tabs.length - 1];
                    if (!target) return;
                    e.preventDefault();
                    selectTab(target.dataset.tab);
                    target.focus();
                });
            });
        }

        function selectTab(tabKey) {
            document.querySelectorAll('.tab-button').forEach(btn => {
                const selected = btn.dataset.tab === tabKey;
                btn.classList.toggle('active', selected);
                btn.setAttribute('aria-selected', selected);
                btn.tabIndex = selected ? 0 : -1;
                if (selected) document.getElementById('tab-panel').setAttribute('aria-labelledby', btn.id);
            });
            loadTabData(tabKey);
        }

        function buildDatasetIndex() {
            datasetIndex = {};
            ['downloads', 'likes', 'last_modified'].forEach(key => {
                (allData[key] || []).forEach(ds => {
                    if (ds && ds.id) datasetIndex[ds.id] = ds;
                });
            });

            trendIndex = {};
            ((allData.trending && allData.trending.items) || []).forEach((item, i) => {
                trendIndex[item.id] = Object.assign({ rank: i + 1 }, item);
            });
        }

        function loadTabData(tabKey) {
            if (tabKey === 'trending') {
                renderTrending();
                return;
            }

            const datasets = allData[tabKey] || [];
            const digest = allData[`${tabKey}_digest`] || "這個分類還沒有摘要。";

            showDatasets(datasets, null);

            const digestTitleMap = {
                'downloads': '下載量趨勢摘要',
                'likes': '按讚數趨勢摘要',
                'last_modified': '最近更新趨勢摘要'
            };
            document.getElementById('digest-title').textContent = digestTitleMap[tabKey] || '摘要報告';
            document.getElementById('digest-content').innerHTML = renderMarkdown(digest);
            renderDigestMeta(tabKey);
        }

        function renderDigestMeta(tabKey) {
            const el = document.getElementById('digest-meta');
            const generated = allData.digests_generated_at?.[tabKey];
            if (!generated) {
                el.textContent = '';
                el.classList.remove('stale');
                return;
            }
            const at = new Date(generated);
            const runAt = allData.created_at ? new Date(allData.created_at) : at;
            const stale = (runAt - at) > 60 * 60 * 1000;
            el.classList.toggle('stale', stale);
            el.textContent = stale
                ? `⚠ 此摘要沿用 ${at.toLocaleDateString()} 的結果`
                : `AI 產生於 ${at.toLocaleString()}`;
        }

        function hfDatasetUrl(id) {
            return 'https://huggingface.co/datasets/' + String(id).split('/').map(encodeURIComponent).join('/');
        }

        function renderIdList(ids) {
            if (!ids || ids.length === 0) return '<p class="trend-note">無</p>';
            const shown = ids.slice(0, 10).map(id =>
                `<li><a href="${hfDatasetUrl(id)}" target="_blank" rel="noopener">${escapeHTML(id)}</a></li>`
            ).join('');
            const more = ids.length > 10 ? `<li class="trend-note">…另外 ${ids.length - 10} 個</li>` : '';
            return `<ul>${shown}${more}</ul>`;
        }

        function renderTrendChips(trend) {
            const rising = trend.downloads_delta >= 0;
            const dir = rising ? 'up' : 'down';
            const chips = [];
            if (trend.downloads_pct !== null && trend.downloads_pct !== undefined) {
                chips.push(`<span class="trend-chip ${dir}">${rising ? '▲' : '▼'} ${Math.abs(trend.downloads_pct)}%</span>`);
            }
            chips.push(`<span class="trend-chip ${dir}">${rising ? '+' : ''}${trend.downloads_delta.toLocaleString()} downloads</span>`);
            if (trend.likes_delta) {
                chips.push(`<span class="trend-chip">${trend.likes_delta > 0 ? '+' : ''}${trend.likes_delta.toLocaleString()} likes</span>`);
            }
            return `<div class="trend-chips">${chips.join('')}</div>`;
        }

        function renderTrending() {
            const trending = allData.trending;
            const digestEl = document.getElementById('digest-content');
            document.getElementById('digest-title').textContent = '趨勢雷達';
            const metaEl = document.getElementById('digest-meta');
            metaEl.classList.remove('stale');
            metaEl.textContent = allData.created_at
                ? `資料更新於 ${new Date(allData.created_at).toLocaleString()}`
                : '';

            if (!trending || !trending.available) {
                digestEl.innerHTML = `<p>${escapeHTML(trending?.reason || '尚未累積足夠的歷史快照，再跑一次資料更新就會出現。')}</p>`;
                showDatasets([]);
                return;
            }

            const totals = trending.totals || {};
            const fmtPct = v => (v === null || v === undefined) ? '—' : `${v > 0 ? '+' : ''}${v}%`;

            digestEl.innerHTML = `
                <div class="trend-summary">
                    <div class="trend-stat"><span class="value">${trending.window_days}</span><span class="label">比較區間（天）</span></div>
                    <div class="trend-stat"><span class="value">${totals.rising ?? 0}</span><span class="label">下載量上升</span></div>
                    <div class="trend-stat"><span class="value">${totals.falling ?? 0}</span><span class="label">下載量下降</span></div>
                    <div class="trend-stat"><span class="value">${fmtPct(totals.downloads_pct)}</span><span class="label">整體下載量變化</span></div>
                    <div class="trend-stat"><span class="value">${trending.entered.length}</span><span class="label">新進榜</span></div>
                </div>
                <div class="trend-lists">
                    <div><h4>新進榜（${trending.entered.length}）</h4>${renderIdList(trending.entered)}</div>
                    <div><h4>掉出榜外（${trending.exited.length}）</h4>${renderIdList(trending.exited)}</div>
                </div>`;

            const cards = trending.items.map(item => datasetIndex[item.id]).filter(Boolean);
            showDatasets(cards, trendIndex);
        }
        
        function modalityColor(modality) {
            return MODALITY_COLORS[modality] || MODALITY_COLORS.default;
        }

        function getModalityAccent(modalities) {
            const list = (modalities || []).map(modalityColor);
            if (list.length === 0) return MODALITY_COLORS.default;
            if (list.length === 1) return list[0];
            const step = 100 / list.length;
            const stops = list.map((c, i) => `${c} ${i * step}% ${(i + 1) * step}%`);
            return `linear-gradient(to bottom, ${stops.join(', ')})`;
        }

        function renderModalityBadges(modalities, className) {
            return (modalities || []).map(m =>
                `<span class="${className}" style="--badge-color: ${modalityColor(m)}">${escapeHTML(m)}</span>`
            ).join('');
        }

        // ---------- 搜尋 / 篩選 / 排序 ----------

        const SORTERS = {
            downloads: (a, b) => (b.downloads || 0) - (a.downloads || 0),
            likes: (a, b) => (b.likes || 0) - (a.likes || 0),
            lastModified: (a, b) => new Date(b.lastModified || 0) - new Date(a.lastModified || 0),
            name: (a, b) => String(a.id || '').localeCompare(String(b.id || '')),
        };

        function setupFilters() {
            document.getElementById('filter-search').addEventListener('input', (e) => {
                filterState.query = e.target.value.trim().toLowerCase();
                applyFilters();
            });
            document.getElementById('filter-sort').addEventListener('change', (e) => {
                filterState.sort = e.target.value;
                applyFilters();
            });
            document.getElementById('filter-clear').addEventListener('click', resetFilters);
        }

        function resetFilters() {
            filterState.query = '';
            filterState.modalities.clear();
            filterState.sort = 'default';
            document.getElementById('filter-search').value = '';
            document.getElementById('filter-sort').value = 'default';
            renderModalityFilters();
            applyFilters();
        }

        function showDatasets(datasets, trendById) {
            currentDatasets = datasets || [];
            currentTrendById = trendById || null;

            const available = new Set();
            currentDatasets.forEach(d => (d.modalities || []).forEach(m => available.add(m)));
            [...filterState.modalities].forEach(m => {
                if (!available.has(m)) filterState.modalities.delete(m);
            });

            document.getElementById('toolbar').hidden = currentDatasets.length === 0;
            renderModalityFilters();
            applyFilters();
        }

        function renderModalityFilters() {
            const box = document.getElementById('filter-modalities');
            const counts = new Map();
            currentDatasets.forEach(d => (d.modalities || []).forEach(m => counts.set(m, (counts.get(m) || 0) + 1)));

            const sorted = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
            box.innerHTML = sorted.map(([m, n]) =>
                `<button type="button" class="modality-filter" data-modality="${escapeHTML(m)}"` +
                ` style="--badge-color: ${modalityColor(m)}"` +
                ` aria-pressed="${filterState.modalities.has(m)}">` +
                `${escapeHTML(m)} <span class="count">${n}</span></button>`
            ).join('');

            box.querySelectorAll('.modality-filter').forEach(btn => {
                btn.addEventListener('click', () => {
                    const m = btn.dataset.modality;
                    if (filterState.modalities.has(m)) {
                        filterState.modalities.delete(m);
                    } else {
                        filterState.modalities.add(m);
                    }
                    btn.setAttribute('aria-pressed', filterState.modalities.has(m));
                    applyFilters();
                });
            });
        }

        function applyFilters() {
            const { query, modalities, sort } = filterState;

            let list = currentDatasets.filter(dataset => {
                if (modalities.size && !(dataset.modalities || []).some(m => modalities.has(m))) return false;
                if (!query) return true;
                return [dataset.id, dataset.author, dataset.description]
                    .some(v => String(v || '').toLowerCase().includes(query));
            });

            if (SORTERS[sort]) list = [...list].sort(SORTERS[sort]);

            const grid = document.getElementById('datasets-grid');
            if (!list.length && currentDatasets.length) {
                grid.innerHTML = '<div class="empty-state">沒有符合條件的資料集。' +
                    ' <button type="button" class="link-button" id="empty-clear">清除篩選</button></div>';
                document.getElementById('empty-clear').addEventListener('click', resetFilters);
            } else {
                renderDatasetCards(list, currentTrendById);
            }

            const total = currentDatasets.length;
            document.getElementById('filter-count').textContent =
                list.length === total ? `共 ${total} 筆` : `顯示 ${list.length} / ${total} 筆`;
            document.getElementById('filter-clear').hidden =
                !(query || modalities.size || sort !== 'default');
        }

        function renderDatasetCards(datasets, trendById) {
            const grid = document.getElementById('datasets-grid');
            grid.innerHTML = '';

            if (!datasets || datasets.length === 0) {
                grid.innerHTML = '<p>這個分類沒有資料集可顯示。</p>';
                return;
            }

            datasets.forEach(dataset => {
                const card = document.createElement('div');
                card.className = 'dataset-card';
                card.style.setProperty('--card-accent', getModalityAccent(dataset.modalities));

                const desc = dataset.description ? (dataset.description.split('\n')[1]?.trim() || dataset.description.trim().substring(0,150) + '...') : 'No description.';
                const trend = trendById && trendById[dataset.id];
                card.innerHTML = `
                    <div class="card-head">
                        <h3><button type="button" class="card-open">${escapeHTML(dataset.id || 'N/A')}</button></h3>
                        ${trend ? `<span class="trend-rank">#${trend.rank}</span>` : ''}
                    </div>
                    <p class="description">${escapeHTML(desc)}</p>
                    ${trend ? renderTrendChips(trend) : ''}
                    <div class="card-foot">
                        <div class="modalities-list">
                            ${renderModalityBadges(dataset.modalities, 'modality-badge')}
                        </div>
                        <p class="meta-info">
                            <strong>${escapeHTML(dataset.author || 'N/A')}</strong><br>
                            ${dataset.downloads?.toLocaleString() || 'N/A'} downloads · ${dataset.likes?.toLocaleString() || 'N/A'} likes<br>
                            更新於 ${dataset.lastModified ? new Date(dataset.lastModified).toLocaleDateString() : 'N/A'}
                        </p>
                    </div>`;
                card.addEventListener('click', () => openDatasetDetailsModal(dataset));
                grid.appendChild(card);
            });
        }

        // AI 產出的 markdown 不能當成可信內容：資料集描述會被原封不動塞進 prompt，
        // 有心人可以在 HF 上發布一個資料集，用描述誘導模型在報告裡吐出 <img onerror=...>，
        // 直接在這個頁面上執行。所以 markdown 轉出來的 HTML 一律先過 DOMPurify。
        function renderMarkdown(text) {
            const source = text ?? '';
            if (!window.DOMPurify) {
                console.warn('DOMPurify 未載入，markdown 改以純文字顯示。');
                return `<pre style="white-space:pre-wrap">${escapeHTML(String(source))}</pre>`;
            }
            return DOMPurify.sanitize(marked.parse(source));
        }

        function escapeHTML(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        
        function cleanDescription(text) {
            return String(text || '')
                .replace(/\t/g, ' ')
                .replace(/[ \u00a0]+$/gm, '')
                .replace(/\n{3,}/g, '\n\n')
                .trim();
        }

        const TAG_FACETS = ['license', 'task_categories', 'size_categories', 'language'];
        const MAX_TAGS_SHOWN = 20;

        function groupTags(tags) {
            const groups = { license: [], task_categories: [], size_categories: [], language: [], other: [] };
            (tags || []).forEach(tag => {
                const idx = tag.indexOf(':');
                const prefix = idx > 0 ? tag.slice(0, idx) : '';
                if (prefix === 'modality') return;   // 已有獨立欄位
                if (TAG_FACETS.includes(prefix)) groups[prefix].push(tag.slice(idx + 1));
                else groups.other.push(tag);
            });
            return groups;
        }

        function renderBadgeList(targetId, values, emptyText) {
            document.getElementById(targetId).innerHTML = values.length
                ? values.map(v => `<span class="tag-badge">${escapeHTML(v)}</span>`).join(' ')
                : `<span>${escapeHTML(emptyText)}</span>`;
        }

        function renderTagList(tags) {
            const container = document.getElementById('modal-tags');
            if (!tags.length) {
                container.innerHTML = '<span>沒有標籤</span>';
                return;
            }
            let expanded = false;
            const draw = () => {
                const shown = expanded ? tags : tags.slice(0, MAX_TAGS_SHOWN);
                container.innerHTML = shown.map(t => `<span class="tag-badge">${escapeHTML(t)}</span>`).join(' ');
                if (tags.length > MAX_TAGS_SHOWN) {
                    const toggle = document.createElement('button');
                    toggle.type = 'button';
                    toggle.className = 'tags-toggle';
                    toggle.textContent = expanded ? '收合' : `顯示全部 ${tags.length.toLocaleString()} 個`;
                    toggle.addEventListener('click', () => { expanded = !expanded; draw(); });
                    container.appendChild(toggle);
                }
            };
            draw();
        }

        function renderSampleRow(sample, container) {
            const cells = sample.row || {};
            const others = {};

            Object.entries(cells).forEach(([name, value]) => {
                const src = value && typeof value === 'object' ? value.src : null;
                if (typeof src !== 'string') {
                    others[name] = value;
                    return;
                }
                const isVideo = /\.(mp4|webm|ogv|mov)(\?|$)/i.test(src) || /video/i.test(name);
                if (isVideo) {
                    const video = document.createElement('video');
                    video.src = src;
                    video.setAttribute('controls', '');
                    video.setAttribute('preload', 'none');
                    container.appendChild(video);
                } else {
                    const img = document.createElement('img');
                    img.src = src;
                    img.setAttribute('loading', 'lazy');
                    img.alt = `${name} 樣本 ${sample.row_idx ?? ''}`.trim();
                    container.appendChild(img);
                }
            });

            if (Object.keys(others).length > 0) {
                const pre = document.createElement('pre');
                pre.textContent = JSON.stringify(others, null, 2);
                container.appendChild(pre);
            }
        }

        function openDatasetDetailsModal(dataset) {
            currentDataset = dataset; // Set for AI assistant
            const datasetId = dataset.id || 'N/A';
            document.getElementById('modal-title-text').textContent = datasetId;
            const titleLink = document.getElementById('modal-title-link');
            if (dataset.id) {
                titleLink.href = `https://huggingface.co/datasets/${dataset.id}`;
                titleLink.style.pointerEvents = 'auto'; // 確保連結可點擊
                titleLink.setAttribute('title', `Go to HuggingFace dataset: ${dataset.id}`);
            } else {
                titleLink.href = '#'; // 如果沒有 ID，則不導向
                titleLink.style.pointerEvents = 'none'; // 不可點擊
                titleLink.removeAttribute('title');
            }
            document.getElementById('modal-author').textContent = dataset.author || 'N/A';

            const trend = trendIndex[dataset.id];
            const trendStat = document.getElementById('modal-trend-stat');
            const hasTrend = trend && trend.downloads_pct !== null && trend.downloads_pct !== undefined;
            trendStat.hidden = !hasTrend;
            trendStat.classList.toggle('up', hasTrend && trend.downloads_pct >= 0);
            trendStat.classList.toggle('down', hasTrend && trend.downloads_pct < 0);
            if (hasTrend) {
                document.getElementById('modal-trend').textContent =
                    `${trend.downloads_pct > 0 ? '+' : ''}${trend.downloads_pct}%`;
                document.getElementById('modal-trend-label').textContent =
                    `近 ${allData.trending.window_days} 天下載量`;
            }
            document.getElementById('modal-downloads').textContent = dataset.downloads?.toLocaleString() || 'N/A';
            document.getElementById('modal-likes').textContent = dataset.likes?.toLocaleString() || 'N/A';
            document.getElementById('modal-createdAt').textContent = dataset.createdAt ? new Date(dataset.createdAt).toLocaleString() : 'N/A';
            document.getElementById('modal-lastModified').textContent = dataset.lastModified ? new Date(dataset.lastModified).toLocaleString() : 'N/A';
            
            document.getElementById('modal-description').textContent =
                cleanDescription(dataset.description) || '沒有描述';

            const tagGroups = groupTags(dataset.tags);
            renderBadgeList('modal-license', tagGroups.license, '未標示');
            renderBadgeList('modal-tasks', tagGroups.task_categories, '未標示');
            renderBadgeList('modal-size', tagGroups.size_categories, '未標示');
            const languages = tagGroups.language;
            document.getElementById('modal-languages').textContent =
                languages.length === 0 ? '未標示'
                : languages.length <= 6 ? languages.join('、')
                : `${languages.length.toLocaleString()} 種`;

            document.getElementById('modal-modalities-list').innerHTML =
                renderModalityBadges(dataset.modalities, 'modal-modality-badge') || '<span>未標示</span>';
            
            renderTagList(tagGroups.other);

            const samplesContainer = document.getElementById('modal-viewer-samples');
            samplesContainer.innerHTML = '';
            if (dataset.viewer_sample_rows && dataset.viewer_sample_rows.length > 0) {
                dataset.viewer_sample_rows.forEach(sample => renderSampleRow(sample, samplesContainer));
                const note = document.createElement('p');
                note.className = 'sample-note';
                const link = document.createElement('a');
                link.href = `${hfDatasetUrl(dataset.id)}/viewer`;
                link.target = '_blank';
                link.rel = 'noopener';
                link.textContent = '在 Hugging Face 上檢視完整樣本';
                note.appendChild(link);
                samplesContainer.appendChild(note);
            } else {
                samplesContainer.innerHTML = '<span>沒有樣本資料</span>';
            }
            if (!datasetModal.open) datasetModal.showModal();
        }

        // --- AI Chat Functionality ---
        function buildPrompt(dataset) {
            return '以下是 Hugging Face 上一個資料集的資訊，請根據這些內容回答我接下來的問題。\n\n'
                + '<資料集>\n' + formatDatasetForPrompt(dataset) + '\n</資料集>';
        }


        async function copyPromptToClipboard() {
            if (!currentDataset) return;
            let ok = true;
            try {
                await navigator.clipboard.writeText(buildPrompt(currentDataset));
            } catch (e) {
                console.error('複製失敗:', e);
                ok = false;
            }
            const original = '複製提示詞';
            copyPromptButton.textContent = ok ? '已複製' : '複製失敗';
            copyPromptButton.classList.toggle('copied', ok);
            setTimeout(() => {
                copyPromptButton.textContent = original;
                copyPromptButton.classList.remove('copied');
            }, 2500);
        }

        function formatDatasetForPrompt(dataset) {
            if (!dataset) return '沒有可用的資料集資訊。';
            const groups = groupTags(dataset.tags);
            const info = {
                id: dataset.id,
                url: hfDatasetUrl(dataset.id),
                author: dataset.author,
                description: cleanDescription(dataset.description),
                modalities: dataset.modalities || [],
                license: groups.license,
                tasks: groups.task_categories,
                size: groups.size_categories,
                languages: groups.language.length > 6
                    ? `${groups.language.length} 種語言`
                    : groups.language,
                otherTags: groups.other.slice(0, MAX_TAGS_SHOWN),
                downloads: dataset.downloads,
                likes: dataset.likes,
                createdAt: dataset.createdAt,
                lastModified: dataset.lastModified
            };
            return JSON.stringify(info, null, 2);
        }
    </script>
</body>
